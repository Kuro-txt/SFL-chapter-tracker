name: SFL Farm Daily Sync

on:
  schedule:
    # 1. Primary Early Run (21:00 UTC / 02:30 AM IST): 1 hour before 22:00 UTC
    - cron: '00 21 * * *'
    # 2. Secondary Run (23:05 UTC / 04:35 AM IST): Safely before 00:00 UTC reset
    - cron: '05 23 * * *'
  workflow_dispatch:

jobs:
  sync-farms:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run SFL Farm Sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SFL_API_KEY: ${{ secrets.SFL_API_KEY }}
        run: node scripts/cron-sync.js
