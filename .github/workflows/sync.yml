name: SFL Farm Daily Sync

on:
  schedule:
    # 1. Primary Early Run (runs ~19:35 - 20:15 UTC, guaranteed before 00:00 UTC reset)
    - cron: '30 19 * * *'
    # 2. Secondary Late Run (catches late evening deliveries)
    - cron: '00 22 * * *'
  workflow_dispatch:

jobs:
  sync-farms:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run SFL Farm Sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SFL_API_KEY: ${{ secrets.SFL_API_KEY }}
        run: node scripts/cron-sync.js
