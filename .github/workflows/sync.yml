name: SFL Farm Daily Sync

on:
  schedule:
    # Runs daily at 21:20 UTC (avoids top-of-hour runner delays)
   - cron: '20 21 * * *'
  workflow_dispatch:

jobs:
  sync-farms:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run SFL Farm Sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SFL_API_KEY: ${{ secrets.SFL_API_KEY }}
        run: node scripts/cron-sync.js
