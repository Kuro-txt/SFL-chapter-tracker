<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SFL Chapter Tracker - Raw Data Inspector</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 sm:p-8 flex flex-col items-center">

  <div class="max-w-4xl w-full space-y-6">
    <!-- Header -->
    <header class="text-center space-y-2">
      <h1 class="text-3xl font-bold text-amber-400 flex items-center justify-center gap-2">
        <span>🌻</span> SFL Chapter Tracker
      </h1>
      <p class="text-slate-400 text-sm">Live Farm API Raw Data Inspector</p>
    </header>

    <!-- Control Box -->
    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-col sm:flex-row gap-3 items-center justify-between shadow-lg">
      <div class="flex items-center gap-3 w-full sm:w-auto">
        <label for="farmId" class="text-xs font-semibold text-slate-300 whitespace-nowrap">Farm ID:</label>
        <input 
          type="text" 
          id="farmId" 
          value="1" 
          placeholder="e.g. 162318" 
          class="bg-slate-900 border border-slate-600 rounded-lg px-3 py-1.5 text-sm w-full sm:w-48 text-amber-300 focus:outline-none focus:border-amber-400 font-mono"
        />
      </div>
      <button 
        id="fetchBtn" 
        onclick="fetchRawData()"
        class="w-full sm:w-auto bg-amber-500 hover:bg-amber-600 active:bg-amber-700 text-slate-950 font-bold px-5 py-2 rounded-lg text-sm transition shadow cursor-pointer"
      >
        Fetch Raw JSON
      </button>
    </div>

    <!-- JSON Output Area -->
    <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 shadow-inner relative">
      <div class="flex justify-between items-center border-b border-slate-800 pb-2 mb-3">
        <span class="text-xs font-mono text-slate-400">Payload Output</span>
        <span id="statusBadge" class="text-[10px] bg-slate-800 text-slate-400 px-2.5 py-0.5 rounded-full font-mono">
          Ready
        </span>
      </div>

      <pre id="jsonViewer" class="text-xs font-mono text-emerald-400 overflow-x-auto max-h-[600px] whitespace-pre-wrap break-words leading-relaxed">
{
  "message": "Enter a Farm ID above and click 'Fetch Raw JSON' to test API output."
}
      </pre>
    </div>
  </div>

  <script>
    async function fetchRawData() {
      const farmIdInput = document.getElementById('farmId');
      const farmId = farmIdInput.value.trim() || '1';
      const viewer = document.getElementById('jsonViewer');
      const badge = document.getElementById('statusBadge');
      const btn = document.getElementById('fetchBtn');

      badge.textContent = 'Fetching...';
      badge.className = 'text-[10px] bg-amber-900/50 text-amber-300 px-2.5 py-0.5 rounded-full font-mono animate-pulse';
      btn.disabled = true;

      try {
        const response = await fetch(`/api/raw?farmId=${encodeURIComponent(farmId)}`);
        const data = await response.json();

        viewer.textContent = JSON.stringify(data, null, 2);
        
        if (response.ok) {
          badge.textContent = `HTTP ${response.status} OK`;
          badge.className = 'text-[10px] bg-emerald-900/50 text-emerald-300 px-2.5 py-0.5 rounded-full font-mono';
        } else {
          badge.textContent = `HTTP ${response.status} Error`;
          badge.className = 'text-[10px] bg-rose-900/50 text-rose-300 px-2.5 py-0.5 rounded-full font-mono';
        }
      } catch (err) {
        viewer.textContent = JSON.stringify({ error: err.message }, null, 2);
        badge.textContent = 'Fetch Failed';
        badge.className = 'text-[10px] bg-rose-900/50 text-rose-300 px-2.5 py-0.5 rounded-full font-mono';
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
