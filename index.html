<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SFL Farm Inspector & Data Viewer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: 'Consolas', 'Courier New', Courier, monospace;
      padding: 14px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      gap: 10px;
    }
    .panel {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    label {
      font-size: 11px;
      font-weight: bold;
      color: #8b949e;
      text-transform: uppercase;
    }
    select, input, button {
      background: #21262d;
      border: 1px solid #30363d;
      color: #e6edf3;
      padding: 6px 10px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 12px;
      outline: none;
    }
    input:focus, select:focus {
      border-color: #58a6ff;
    }
    button {
      background: #238636;
      border-color: #2ea043;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      padding: 6px 14px;
    }
    button:hover { background: #2ea043; }
    .btn-copy { background: #30363d; border-color: #8b949e; }
    .btn-copy:hover { background: #484f58; }
    .status-bar {
      font-size: 11px;
      color: #8b949e;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      padding: 0 4px;
    }
    .status-bar strong { color: #3fb950; }
    .viewer-container {
      flex: 1;
      display: flex;
      gap: 10px;
      min-height: 0;
    }
    pre {
      flex: 1;
      background: #090d12;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 14px;
      overflow: auto;
      font-size: 12px;
      line-height: 1.45;
      color: #7ee787;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>

  <div class="panel">
    <!-- Top Row: Fetch / Sources -->
    <div class="row">
      <label for="farmId">🌾 Farm ID:</label>
      <input type="text" id="farmId" value="8472883706403914" style="width: 150px;" />

      <label for="apiKey">🔑 API Key:</label>
      <input type="password" id="apiKey" placeholder="Optional SFL Key" style="width: 130px;" />

      <label for="dataSource">🎯 Fetch Source:</label>
      <select id="dataSource" style="min-width: 170px;">
        <option value="rawSfl">⚡ Live SFL Farm API</option>
        <option value="rawPrices">💰 SFL.world Market Prices</option>
        <option value="localStorage">📦 Local Browser Storage</option>
      </select>

      <button onclick="fetchClientData()">⚡ Fetch</button>
      <button onclick="copyOutput()" class="btn-copy">📋 Copy</button>
    </div>

    <!-- Bottom Row: Filter Dropdowns -->
    <div class="row" style="border-top: 1px dashed #30363d; padding-top: 8px;">
      <label for="viewCategory">📂 Section:</label>
      <select id="viewCategory" onchange="handleCategoryChange()" style="font-weight: bold; color: #58a6ff;">
        <option value="all">🌐 Full Raw Payload</option>
        <option value="npcs">👤 NPCs & Friendship</option>
        <option value="skills">🧠 Bumpkin Skills & XP</option>
        <option value="deliveries">📦 Active Orders & Deliveries</option>
        <option value="chores">🧹 Chores Board</option>
        <option value="bounties">📜 Bounties (Requests & Completed)</option>
        <option value="inventory">🎒 Inventory & Balances</option>
        <option value="farmActivity">📊 Farm Activity Tracker</option>
        <option value="animals">🐄 Animals (Barn & Hen House)</option>
        <option value="buildings">🏛️ Buildings & Facilities</option>
        <option value="trades">⚖️ Trades & Market Listings</option>
      </select>

      <!-- Dynamic Sub-Filter -->
      <div id="subFilterGroup" style="display: flex; gap: 6px; align-items: center;">
        <label for="subFilter" id="subFilterLabel">🔎 Filter:</label>
        <select id="subFilter" onchange="applyViewFilter()" style="min-width: 180px;">
          <option value="all">-- All --</option>
        </select>
      </div>

      <span id="itemCountBadge" style="font-size: 11px; color: #8b949e; margin-left: auto;"></span>
    </div>
  </div>

  <div class="status-bar">
    <span>Status: <strong id="statusDisplay">—</strong></span>
    <span>Time: <strong id="timeDisplay">—</strong></span>
    <span>Payload Size: <strong id="sizeDisplay">—</strong></span>
    <span>Active Section: <strong id="sectionDisplay" style="color: #58a6ff;">Full Raw Payload</strong></span>
  </div>

  <div class="viewer-container">
    <pre id="output">// Click "Fetch" to load farm state into inspector...</pre>
  </div>

  <script>
    let fullPayload = null;
    let displayedData = null;

    document.addEventListener('DOMContentLoaded', () => {
      const savedFarm = localStorage.getItem('sfl_farmId');
      if (savedFarm) document.getElementById('farmId').value = savedFarm;

      const savedKey = localStorage.getItem('sfl_apiKey');
      if (savedKey) document.getElementById('apiKey').value = savedKey;
    });

async function fetchClientData() {
  const source = document.getElementById('dataSource').value;
  const farmId = document.getElementById('farmId').value.trim() || '8472883706403914';
  const apiKey = document.getElementById('apiKey').value.trim();
  const out = document.getElementById('output');

  localStorage.setItem('sfl_farmId', farmId);
  if (apiKey) localStorage.setItem('sfl_apiKey', apiKey);

  const t0 = performance.now();
  document.getElementById('statusDisplay').textContent = 'Fetching...';

  try {
    if (source === 'localStorage') {
      const storageData = {};
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        try {
          storageData[key] = JSON.parse(localStorage.getItem(key));
        } catch (e) {
          storageData[key] = localStorage.getItem(key);
        }
      }
      fullPayload = storageData;
      document.getElementById('statusDisplay').textContent = '200 OK (Local)';
    } else {
      const targetUrl = source === 'rawSfl'
        ? `https://api.sunflower-land.com/community/farms/${encodeURIComponent(farmId)}`
        : `https://sfl.world/api/v1/prices`;

      out.textContent = `Fetching data...`;

      // Candidate list: Try own backend proxy first, then fallback proxies
      const candidateUrls = [
        // 1. Direct project backend proxy (if running via Vercel / server)
        source === 'rawSfl' 
          ? `/api/chapter?action=rawSfl&farmId=${encodeURIComponent(farmId)}${apiKey ? `&apiKey=${encodeURIComponent(apiKey)}` : ''}`
          : `/api/chapter?action=rawPrices`,
        // 2. AllOrigins CORS Proxy
        `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`,
        // 3. Codeet CORS Proxy
        `https://proxy.cors.sh/${targetUrl}`,
        // 4. CorsProxy.io
        `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`
      ];

      let res = null;
      let lastError = null;

      for (const url of candidateUrls) {
        try {
          const headers = { 'Accept': 'application/json' };
          if (apiKey && !url.includes('/api/chapter')) headers['x-api-key'] = apiKey;

          const testRes = await fetch(url, { headers });
          if (testRes.ok) {
            res = testRes;
            break;
          }
        } catch (err) {
          lastError = err;
        }
      }

      if (!res || !res.ok) {
        throw new Error(lastError?.message || `403 Forbidden: Sunflower Land blocked the request. Use your local server endpoint (e.g. localhost:3000 or Vercel deployment) or provide an SFL API Key.`);
      }

      fullPayload = await res.json();
      const elapsed = (performance.now() - t0).toFixed(0);
      document.getElementById('statusDisplay').textContent = `${res.status} OK`;
      document.getElementById('timeDisplay').textContent = `${elapsed}ms`;
    }

    populateSubFilterDropdown();
    applyViewFilter();

  } catch (err) {
    document.getElementById('statusDisplay').textContent = 'Error';
    out.textContent = `❌ Fetch Failed: ${err.message}`;
  }
}
    function handleCategoryChange() {
      populateSubFilterDropdown();
      applyViewFilter();
    }

    function populateSubFilterDropdown() {
      const category = document.getElementById('viewCategory').value;
      const subSelect = document.getElementById('subFilter');
      const subGroup = document.getElementById('subFilterGroup');
      const subLabel = document.getElementById('subFilterLabel');

      if (!fullPayload || !fullPayload.farm) {
        subGroup.style.display = 'none';
        return;
      }

      const farm = fullPayload.farm;
      subSelect.innerHTML = '<option value="all">-- All --</option>';

      if (category === 'npcs') {
        subGroup.style.display = 'flex';
        subLabel.textContent = '👤 NPC:';
        const npcs = Object.keys(farm.npcs || {}).sort();
        npcs.forEach(npc => {
          subSelect.innerHTML += `<option value="${npc}">${npc.toUpperCase()}</option>`;
        });
      } else if (category === 'inventory') {
        subGroup.style.display = 'flex';
        subLabel.textContent = '📦 Filter Item:';
        const items = Object.keys(farm.inventory || {}).sort();
        items.forEach(item => {
          subSelect.innerHTML += `<option value="${item}">${item}</option>`;
        });
      } else if (category === 'farmActivity') {
        subGroup.style.display = 'flex';
        subLabel.textContent = '📊 Filter Action:';
        const activities = Object.keys(farm.farmActivity || {}).sort();
        activities.forEach(act => {
          subSelect.innerHTML += `<option value="${act}">${act}</option>`;
        });
      } else {
        subGroup.style.display = 'none';
      }
    }

    function applyViewFilter() {
      if (!fullPayload) return;

      const category = document.getElementById('viewCategory').value;
      const subVal = document.getElementById('subFilter').value;
      const farm = fullPayload.farm || fullPayload;
      const badge = document.getElementById('itemCountBadge');

      badge.textContent = '';

      switch (category) {
        case 'npcs':
          if (subVal !== 'all' && farm.npcs?.[subVal]) {
            displayedData = {
              npc: subVal,
              stats: farm.npcs[subVal],
              liveOrders: (farm.delivery?.orders || []).filter(o => (o.from || '').toLowerCase() === subVal.toLowerCase())
            };
          } else {
            displayedData = farm.npcs || {};
          }
          badge.textContent = `${Object.keys(farm.npcs || {}).length} NPCs`;
          break;

        case 'skills':
          displayedData = {
            experience: farm.bumpkin?.experience || 0,
            equipped: farm.bumpkin?.equipped || {},
            skillsCount: Object.keys(farm.bumpkin?.skills || {}).length,
            skills: farm.bumpkin?.skills || {},
            achievements: farm.bumpkin?.achievements || {},
            previousPowerUseAt: farm.bumpkin?.previousPowerUseAt || {}
          };
          badge.textContent = `${displayedData.skillsCount} Skills Active`;
          break;

        case 'deliveries':
          displayedData = {
            fulfilledCount: farm.delivery?.fulfilledCount || 0,
            activeOrdersCount: (farm.delivery?.orders || []).length,
            orders: farm.delivery?.orders || [],
            milestone: farm.delivery?.milestone || {}
          };
          badge.textContent = `${displayedData.activeOrdersCount} Orders Active`;
          break;

        case 'chores':
          displayedData = {
            choreBoard: farm.choreBoard?.chores || {},
            kingdomChores: farm.kingdomChores || {}
          };
          badge.textContent = `${Object.keys(farm.choreBoard?.chores || {}).length} Chores`;
          break;

        case 'bounties':
          displayedData = {
            totalRequests: (farm.bounties?.requests || []).length,
            totalCompleted: (farm.bounties?.completed || []).length,
            requests: farm.bounties?.requests || [],
            completed: farm.bounties?.completed || []
          };
          badge.textContent = `${displayedData.totalRequests} Requests`;
          break;

        case 'inventory':
          if (subVal !== 'all' && farm.inventory?.[subVal] !== undefined) {
            displayedData = { [subVal]: farm.inventory[subVal] };
          } else {
            displayedData = {
              coins: farm.coins,
              balanceSFL: farm.balance,
              inventory: farm.inventory || {},
              wardrobe: farm.wardrobe || {}
            };
          }
          badge.textContent = `${Object.keys(farm.inventory || {}).length} Items`;
          break;

        case 'farmActivity':
          if (subVal !== 'all' && farm.farmActivity?.[subVal] !== undefined) {
            displayedData = { [subVal]: farm.farmActivity[subVal] };
          } else {
            displayedData = farm.farmActivity || {};
          }
          badge.textContent = `${Object.keys(farm.farmActivity || {}).length} Tracked Activities`;
          break;

        case 'animals':
          displayedData = {
            henHouse: farm.henHouse || {},
            barn: farm.barn || {}
          };
          break;

        case 'buildings':
          displayedData = {
            buildings: farm.buildings || {},
            collectibles: farm.collectibles || {},
            interior: farm.interior?.ground?.collectibles || {}
          };
          break;

        case 'trades':
          displayedData = {
            tradePoints: farm.trades?.tradePoints || 0,
            soldCount: farm.trades?.soldCount || 0,
            listings: farm.trades?.listings || {},
            offers: farm.trades?.offers || {}
          };
          badge.textContent = `${Object.keys(farm.trades?.listings || {}).length} Active Listings`;
          break;

        case 'all':
        default:
          displayedData = fullPayload;
          break;
      }

      const jsonStr = JSON.stringify(displayedData, null, 2);
      document.getElementById('output').textContent = jsonStr;
      document.getElementById('sizeDisplay').textContent = `${(new Blob([jsonStr]).size / 1024).toFixed(1)} KB`;
      document.getElementById('sectionDisplay').textContent = document.getElementById('viewCategory').selectedOptions[0].text;
    }

    function copyOutput() {
      const out = document.getElementById('output');
      navigator.clipboard.writeText(out.textContent).then(() => {
        alert('Copied section JSON to clipboard!');
      });
    }
  </script>
</body>
</html>
