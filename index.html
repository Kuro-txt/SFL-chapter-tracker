<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SFL Direct API Inspector</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f111a;
      color: #e6edf3;
      font-family: monospace;
      padding: 16px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      gap: 10px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      background: #161b22;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #30363d;
    }
    select, input, button {
      background: #21262d;
      border: 1px solid #30363d;
      color: #e6edf3;
      padding: 6px 10px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 12px;
      outline: none;
    }
    button {
      background: #238636;
      border-color: #2ea043;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #2ea043; }
    .status-bar {
      font-size: 11px;
      color: #8b949e;
      display: flex;
      gap: 16px;
    }
    .status-bar strong { color: #3fb950; }
    pre {
      flex: 1;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 14px;
      overflow: auto;
      font-size: 12px;
      line-height: 1.45;
      color: #c9d1d9;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>

  <div class="controls">
    <label style="color:#58a6ff; font-weight:bold;">Source:</label>
    <select id="endpointSelect">
      <option value="rawSfl">Direct SFL Farm API (api.sunflower-land.com)</option>
      <option value="rawPrices">Direct SFL Prices (sfl.world)</option>
    </select>

    <label style="color:#7ee787; font-weight:bold;">Section:</label>
    <select id="sectionSelect" onchange="filterSection()">
      <option value="ALL">📦 ALL DATA</option>
      <option value="delivery">📦 delivery</option>
      <option value="npcs">👥 npcs</option>
      <option value="bounties">📜 bounties</option>
      <option value="chores">🧹 chores / choreBoard</option>
      <option value="inventory">🎒 inventory</option>
      <option value="vip">👑 vip</option>
    </select>

    <input type="text" id="farmIdInput" value="8472883706403914" placeholder="Farm ID" style="width: 160px;" />
    <button onclick="fetchData()">⚡ Fetch API</button>
  </div>

  <div class="status-bar">
    <span>Status: <strong id="statusDisplay">—</strong></span>
    <span>Time: <strong id="timeDisplay">—</strong></span>
    <span>Size: <strong id="sizeDisplay">—</strong></span>
  </div>

  <pre id="output">// Click "Fetch API" to query directly from the browser...</pre>

  <script>
    let rawData = null;

    async function fetchData() {
      const ep = document.getElementById('endpointSelect').value;
      const farmId = document.getElementById('farmIdInput').value.trim() || '8472883706403914';
      const out = document.getElementById('output');

      let targetUrl = ep === 'rawSfl'
        ? `https://api.sunflower-land.com/community/farms/${encodeURIComponent(farmId)}`
        : `https://sfl.world/api/v1/prices`;

      out.textContent = `Fetching directly from ${targetUrl}...`;
      const t0 = performance.now();

      try {
        let res;
        try {
          res = await fetch(targetUrl);
        } catch (corsErr) {
          // CORS fallback proxy if direct fetch is blocked by browser origin
          targetUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;
          res = await fetch(targetUrl);
        }

        const elapsed = (performance.now() - t0).toFixed(0);
        document.getElementById('statusDisplay').textContent = `${res.status} ${res.statusText}`;
        document.getElementById('timeDisplay').textContent = `${elapsed}ms`;

        if (!res.ok) throw new Error(`HTTP ${res.status}: ${res.statusText}`);

        rawData = await res.json();
        const str = JSON.stringify(rawData, null, 2);
        document.getElementById('sizeDisplay').textContent = `${(new Blob([str]).size / 1024).toFixed(1)} KB`;

        filterSection();
      } catch (err) {
        document.getElementById('statusDisplay').textContent = 'Error';
        out.textContent = `Fetch Failed: ${err.message}\n\nTarget URL: ${targetUrl}`;
      }
    }

    function filterSection() {
      if (!rawData) return;
      const sec = document.getElementById('sectionSelect').value;
      const out = document.getElementById('output');

      if (sec === 'ALL') {
        out.textContent = JSON.stringify(rawData, null, 2);
        return;
      }

      const farm = rawData.farm || rawData;
      let target = farm[sec];

      // SFL alternative keys
      if (target === undefined && sec === 'chores') {
        target = farm.choreBoard || farm.chores;
      }

      out.textContent = target !== undefined 
        ? JSON.stringify(target, null, 2) 
        : JSON.stringify({ error: `Section '${sec}' not found in payload.` }, null, 2);
    }
  </script>
</body>
</html>
