<!-- Manual Chapter Track Section with Explicit Labels -->
<div class="input-group" style="background:#E8F5E9; padding:8px 12px; border:2px solid #2E7D32; border-radius:8px; display:flex; align-items:center; gap:8px;">
  <span style="color:#1B5E20; font-weight:900; font-size:12px;">🛤️ TRACK:</span>
  
  <label for="trackTicketsInput" style="color:#2E7D32; font-weight:bold; font-size:11px;">Tix:</label>
  <input 
    type="number" 
    id="trackTicketsInput" 
    value="0" 
    placeholder="0" 
    onchange="saveTrackAndRecalculate()" 
    style="width: 65px; padding: 4px 6px; font-size: 11px;" 
    title="Total Track Tickets Claimed" 
  />
  
  <label for="trackCostInput" style="color:#2E7D32; font-weight:bold; font-size:11px;">SFL:</label>
  <input 
    type="number" 
    step="0.01" 
    id="trackCostInput" 
    value="0" 
    placeholder="0.00" 
    onchange="saveTrackAndRecalculate()" 
    style="width: 75px; padding: 4px 6px; font-size: 11px;" 
    title="Total SFL Spent on Track" 
  />
</div>
