<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SFL Chapter Tracker - Ticket Deliveries</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 sm:p-8 flex flex-col items-center">

  <div class="max-w-7xl w-full space-y-6">
    <!-- Header -->
    <header class="text-center space-y-2">
      <h1 class="text-3xl font-bold text-amber-400 flex items-center justify-center gap-2">
        <span>🌻</span> SFL Chapter Tracker
      </h1>
      <p class="text-slate-400 text-sm">Chapter Ticket Deliveries, Bounties & Chores</p>
    </header>

    <!-- Controls & Status Bar -->
    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-col sm:flex-row gap-3 items-center justify-between shadow-lg">
      <div class="flex items-center gap-3 w-full sm:w-auto">
        <label for="farmId" class="text-xs font-semibold text-slate-300">Farm ID:</label>
        <input 
          type="text" 
          id="farmId" 
          value="8472883706403914" 
          class="bg-slate-900 border border-slate-600 rounded-lg px-3 py-1.5 text-sm w-full sm:w-56 text-amber-300 focus:outline-none focus:border-amber-400 font-mono"
        />
        <div id="vipBadge" class="hidden text-[10px] px-2 py-1 rounded bg-amber-500/20 text-amber-300 font-bold border border-amber-500/30">
          👑 VIP Active (+2 Tickets)
        </div>
      </div>
      <button 
        onclick="loadTrackerData()" 
        class="w-full sm:w-auto bg-amber-500 hover:bg-amber-600 active:bg-amber-700 text-slate-950 font-bold px-5 py-2 rounded-lg text-sm transition shadow cursor-pointer"
      >
        Fetch Filtered Data
      </button>
    </div>

    <!-- 4-Column Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">

      <!-- Active Deliveries Card -->
      <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-md flex flex-col">
        <h2 class="text-base font-bold text-violet-400 mb-3 border-b border-slate-700 pb-2 flex justify-between items-center">
          <span>📦 Deliveries</span>
          <span id="deliveriesCount" class="text-xs font-mono bg-slate-700 px-2 py-0.5 rounded text-slate-300">0</span>
        </h2>
        <div id="deliveriesList" class="space-y-3 overflow-y-auto max-h-[600px] pr-1">
          <p class="text-xs text-slate-500">Click fetch to load deliveries...</p>
        </div>
      </div>

      <!-- Bounties Card -->
      <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-md flex flex-col">
        <h2 class="text-base font-bold text-amber-400 mb-3 border-b border-slate-700 pb-2 flex justify-between items-center">
          <span>📜 Bounties</span>
          <span id="bountiesCount" class="text-xs font-mono bg-slate-700 px-2 py-0.5 rounded text-slate-300">0</span>
        </h2>
        <div id="bountiesList" class="space-y-2 overflow-y-auto max-h-[600px] pr-1">
          <p class="text-xs text-slate-500">Click fetch to load bounties...</p>
        </div>
      </div>

      <!-- Chores Card -->
      <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-md flex flex-col">
        <h2 class="text-base font-bold text-emerald-400 mb-3 border-b border-slate-700 pb-2 flex justify-between items-center">
          <span>🧹 Chores</span>
          <span id="choresCount" class="text-xs font-mono bg-slate-700 px-2 py-0.5 rounded text-slate-300">0</span>
        </h2>
        <div id="choresList" class="space-y-2 overflow-y-auto max-h-[600px] pr-1">
          <p class="text-xs text-slate-500">Click fetch to load chores...</p>
        </div>
      </div>

      <!-- NPCs Card -->
      <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-md flex flex-col">
        <h2 class="text-base font-bold text-sky-400 mb-3 border-b border-slate-700 pb-2 flex justify-between items-center">
          <span>👥 NPCs</span>
          <span id="npcsCount" class="text-xs font-mono bg-slate-700 px-2 py-0.5 rounded text-slate-300">0</span>
        </h2>
        <div id="npcsList" class="space-y-2 overflow-y-auto max-h-[600px] pr-1">
          <p class="text-xs text-slate-500">Click fetch to load NPC data...</p>
        </div>
      </div>

    </div>
  </div>

  <script>
    async function loadTrackerData() {
      const farmId = document.getElementById('farmId').value.trim() || '8472883706403914';
      
      try {
        const response = await fetch(`/api/chapter?farmId=${encodeURIComponent(farmId)}`);
        const data = await response.json();

        if (data.error) throw new Error(data.error);

        // Show VIP Status
        const vipBadge = document.getElementById('vipBadge');
        if (data.isVipActive) {
          vipBadge.classList.remove('hidden');
        } else {
          vipBadge.classList.add('hidden');
        }

        // Render Deliveries
        const deliveriesContainer = document.getElementById('deliveriesList');
        document.getElementById('deliveriesCount').textContent = data.deliveries.length;
        deliveriesContainer.innerHTML = data.deliveries.map(d => {
          const calc = d.ticketCalculation;
          return `
            <div class="bg-slate-900/90 p-3 rounded-lg border ${calc ? 'border-amber-500/40 bg-amber-950/10' : 'border-slate-700'} text-xs space-y-2">
              <div class="flex justify-between items-center">
                <span class="font-bold text-amber-300 capitalize flex items-center gap-1">
                  ${d.from}
                  ${calc ? `<span class="text-[9px] bg-amber-500 text-slate-950 px-1.5 py-0.2 rounded font-bold">Chapter NPC</span>` : ''}
                </span>
                <span class="text-[10px] text-slate-500 font-mono">${d.id}</span>
              </div>

              <div class="text-slate-200 font-medium bg-slate-950/50 p-2 rounded border border-slate-800">
                ${Object.entries(d.items).map(([item, qty]) => `<div>• ${qty}x <span class="text-slate-100 font-bold">${item}</span></div>`).join('')}
              </div>

              ${calc ? `
                <div class="bg-slate-950/80 p-2 rounded border border-amber-500/20 space-y-1 font-mono text-[11px]">
                  <div class="flex justify-between text-amber-300 font-bold border-b border-slate-800 pb-1">
                    <span>Base + VIP:</span>
                    <span>${calc.basePlusVip} Tickets</span>
                  </div>
                  <div class="flex justify-between text-slate-400 text-[10px]">
                    <span>1 Boost Item:</span>
                    <span>${calc.oneBoost} Tickets</span>
                  </div>
                  <div class="flex justify-between text-slate-400 text-[10px]">
                    <span>2 Boost Items:</span>
                    <span>${calc.twoBoosts} Tickets</span>
                  </div>
                  <div class="flex justify-between text-emerald-400 text-[10px] font-bold">
                    <span>3 Boost Items:</span>
                    <span>${calc.threeBoosts} Tickets</span>
                  </div>
                </div>
              ` : `
                <div class="text-[10px] text-emerald-400 font-mono">
                  Reward: ${d.rewardCoins ? `${d.rewardCoins} Coins` : ''} ${d.rewardSFL ? `${d.rewardSFL} SFL` : ''} ${Object.entries(d.rewardItems).map(([item, qty]) => `${qty} ${item}`).join(' ')}
                </div>
              `}
            </div>
          `;
        }).join('');

        // Render Bounties
        const bountiesContainer = document.getElementById('bountiesList');
        document.getElementById('bountiesCount').textContent = data.bounties.length;
        bountiesContainer.innerHTML = data.bounties.map(b => `
          <div class="bg-slate-900/80 p-2.5 rounded-lg border border-slate-700 text-xs flex justify-between items-center">
            <div>
              <div class="font-bold text-slate-200 capitalize">${b.name} ${b.level ? `<span class="text-[10px] text-amber-400 font-mono">(Lvl ${b.level})</span>` : ''}</div>
              <div class="text-[10px] text-slate-500">ID: ${b.id}</div>
            </div>
            <div class="text-right">
              ${b.coins ? `<div class="text-amber-400 font-bold font-mono">+${b.coins} Coins</div>` : ''}
              ${Object.entries(b.rewards).map(([item, qty]) => `<div class="text-emerald-400 font-bold font-mono">+${qty} ${item}</div>`).join('')}
            </div>
          </div>
        `).join('');

        // Render Chores
        const choresContainer = document.getElementById('choresList');
        document.getElementById('choresCount').textContent = data.chores.length;
        choresContainer.innerHTML = data.chores.map(c => `
          <div class="bg-slate-900/80 p-2.5 rounded-lg border ${c.completed ? 'border-emerald-500/40 bg-emerald-950/20' : 'border-slate-700'} text-xs space-y-1">
            <div class="flex justify-between items-center">
              <span class="font-bold capitalize text-slate-200">${c.npc}</span>
              <span class="text-[10px] px-2 py-0.5 rounded ${c.completed ? 'bg-emerald-900 text-emerald-300' : 'bg-slate-800 text-amber-300'} font-mono">
                ${c.completed ? 'Done' : 'Active'}
              </span>
            </div>
            <div class="text-slate-300">${c.task}</div>
            <div class="text-[10px] text-emerald-400 font-mono">
              Reward: ${Object.entries(c.reward).map(([item, qty]) => `${qty} ${item}`).join(', ')}
            </div>
          </div>
        `).join('');

        // Render NPCs
        const npcsContainer = document.getElementById('npcsList');
        document.getElementById('npcsCount').textContent = data.npcs.length;
        npcsContainer.innerHTML = data.npcs.map(n => `
          <div class="bg-slate-900/80 p-2.5 rounded-lg border border-slate-700 text-xs flex justify-between items-center">
            <div>
              <div class="font-bold text-slate-200 capitalize">${n.npc}</div>
              <div class="text-[10px] text-slate-400">Delivered: ${n.deliveriesCompleted} | Skipped: ${n.deliveriesSkipped}</div>
            </div>
            <div class="text-right">
              <div class="text-sky-400 font-bold font-mono">${n.friendshipPoints} pts</div>
              <div class="text-[10px] text-slate-400">${n.choresCompleted} Chores</div>
            </div>
          </div>
        `).join('');

      } catch (err) {
        alert('Error fetching data: ' + err.message);
      }
    }
  </script>
</body>
</html>
