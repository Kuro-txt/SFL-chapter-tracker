<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modern Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #0f172a;
    }

    .calculator {
      background: #1e293b;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      width: 100%;
      max-width: 320px;
    }

    .display {
      background: #0f172a;
      color: #f8fafc;
      font-size: 2rem;
      text-align: right;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      white-space: nowrap;
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      padding: 16px;
      font-size: 1.25rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #334155;
      color: #f8fafc;
      transition: background 0.15s ease, transform 0.05s ease;
    }

    button:hover {
      background: #475569;
    }

    button:active {
      transform: scale(0.96);
    }

    button.operator {
      background: #3b82f6;
    }

    button.operator:hover {
      background: #2563eb;
    }

    button.action {
      background: #ef4444;
    }

    button.action:hover {
      background: #dc2626;
    }

    button.equals {
      grid-column: span 2;
      background: #10b981;
    }

    button.equals:hover {
      background: #059669;
    }
  </style>
</head>
<body>

  <div class="calculator">
    <div id="display" class="display">0</div>
    <div class="buttons">
      <button class="action" onclick="clearDisplay()">AC</button>
      <button class="action" onclick="deleteLast()">DEL</button>
      <button class="operator" onclick="appendValue('/')">÷</button>
      <button class="operator" onclick="appendValue('*')">×</button>

      <button onclick="appendValue('7')">7</button>
      <button onclick="appendValue('8')">8</button>
      <button onclick="appendValue('9')">9</button>
      <button class="operator" onclick="appendValue('-')">−</button>

      <button onclick="appendValue('4')">4</button>
      <button onclick="appendValue('5')">5</button>
      <button onclick="appendValue('6')">6</button>
      <button class="operator" onclick="appendValue('+')">+</button>

      <button onclick="appendValue('1')">1</button>
      <button onclick="appendValue('2')">2</button>
      <button onclick="appendValue('3')">3</button>
      <button onclick="appendValue('.')">.</button>

      <button onclick="appendValue('0')">0</button>
      <button class="equals" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');
    let currentInput = '0';
    let shouldResetDisplay = false;

    function updateDisplay() {
      display.innerText = currentInput;
    }

    function appendValue(val) {
      if (currentInput === '0' && !isNaN(val)) {
        currentInput = val;
      } else if (shouldResetDisplay && !isNaN(val)) {
        currentInput = val;
        shouldResetDisplay = false;
      } else {
        // Prevent consecutive operators
        const lastChar = currentInput.slice(-1);
        if (['+', '-', '*', '/'].includes(lastChar) && ['+', '-', '*', '/'].includes(val)) {
          currentInput = currentInput.slice(0, -1) + val;
        } else {
          currentInput += val;
        }
      }
      updateDisplay();
    }

    function clearDisplay() {
      currentInput = '0';
      shouldResetDisplay = false;
      updateDisplay();
    }

    function deleteLast() {
      if (currentInput.length === 1 || currentInput === 'Error') {
        currentInput = '0';
      } else {
        currentInput = currentInput.slice(0, -1);
      }
      updateDisplay();
    }

    function calculate() {
      try {
        // Safe evaluation without raw eval
        const sanitizedExpression = currentInput.replace(/[^0-9+\-*/.]/g, '');
        const result = Function(`'use strict'; return (${sanitizedExpression})`)();
        
        if (!isFinite(result) || isNaN(result)) {
          currentInput = 'Error';
        } else {
          currentInput = parseFloat(result.toFixed(8)).toString();
        }
        shouldResetDisplay = true;
      } catch (err) {
        currentInput = 'Error';
      }
      updateDisplay();
    }

    // Keyboard support
    window.addEventListener('keydown', (e) => {
      if (!isNaN(e.key) || ['+', '-', '*', '/', '.'].includes(e.key)) {
        appendValue(e.key);
      } else if (e.key === 'Enter' || e.key === '=') {
        calculate();
      } else if (e.key === 'Backspace') {
        deleteLast();
      } else if (e.key === 'Escape') {
        clearDisplay();
      }
    });
  </script>
</body>
</html>
