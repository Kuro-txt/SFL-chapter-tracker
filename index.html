<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SFL Client-Side API & Storage Inspector</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: 'Consolas', 'Courier New', Courier, monospace;
      padding: 14px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      gap: 10px;
    }
    .panel {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    label {
      font-size: 11px;
      font-weight: bold;
      color: #8b949e;
      text-transform: uppercase;
    }
    select, input, button {
      background: #21262d;
      border: 1px solid #30363d;
      color: #e6edf3;
      padding: 6px 10px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 12px;
      outline: none;
    }
    input:focus, select:focus {
      border-color: #58a6ff;
    }
    button {
      background: #238636;
      border-color: #2ea043;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      padding: 6px 14px;
    }
    button:hover { background: #2ea043; }
    .btn-copy { background: #30363d; border-color: #8b949e; }
    .btn-copy:hover { background: #484f58; }
    .status-bar {
      font-size: 11px;
      color: #8b949e;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      padding: 0 4px;
    }
    .status-bar strong { color: #3fb950; }
    pre {
      flex: 1;
      background: #090d12;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 14px;
      overflow: auto;
      font-size: 12px;
      line-height: 1.45;
      color: #7ee787;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>

  <div class="panel">
    <div class="row">
      <label for="farmId">🌾 Farm ID:</label>
      <input type="text" id="farmId" value="8472883706403914" style="width: 150px;" />

      <label for="apiKey">🔑 API Key:</label>
      <input type="password" id="apiKey" placeholder="Optional SFL Key" style="width: 140px;" />

      <label for="dataSource">🎯 Source:</label>
      <select id="dataSource" style="flex: 1; min-width: 180px;">
        <option value="rawSfl">⚡ Raw SFL Farm Data (api.sunflower-land.com)</option>
        <option value="rawPrices">💰 SFL.world Market Prices</option>
        <option value="localStorage">📦 Local Browser Storage (Cache & Vault)</option>
      </select>

      <button onclick="fetchClientData()">⚡ Fetch Data</button>
      <button onclick="copyOutput()" class="btn-copy">📋 Copy JSON</button>
    </div>
  </div>

  <div class="status-bar">
    <span>Status: <strong id="statusDisplay">—</strong></span>
    <span>Time: <strong id="timeDisplay">—</strong></span>
    <span>Size: <strong id="sizeDisplay">—</strong></span>
  </div>

  <pre id="output">// Click "Fetch Data" to inspect payload directly in the browser...</pre>

  <script>
    let rawData = null;

    document.addEventListener('DOMContentLoaded', () => {
      const savedFarm = localStorage.getItem('sfl_farmId');
      if (savedFarm) document.getElementById('farmId').value = savedFarm;

      const savedKey = localStorage.getItem('sfl_apiKey');
      if (savedKey) document.getElementById('apiKey').value = savedKey;
    });

    async function fetchClientData() {
      const source = document.getElementById('dataSource').value;
      const farmId = document.getElementById('farmId').value.trim() || '8472883706403914';
      const apiKey = document.getElementById('apiKey').value.trim();
      const out = document.getElementById('output');

      localStorage.setItem('sfl_farmId', farmId);
      if (apiKey) localStorage.setItem('sfl_apiKey', apiKey);

      const t0 = performance.now();
      document.getElementById('statusDisplay').textContent = 'Fetching...';

      try {
        if (source === 'localStorage') {
          // Inspect browser local storage items
          const storageData = {};
          for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            try {
              storageData[key] = JSON.parse(localStorage.getItem(key));
            } catch (e) {
              storageData[key] = localStorage.getItem(key);
            }
          }
          rawData = storageData;
          const elapsed = (performance.now() - t0).toFixed(0);
          document.getElementById('statusDisplay').textContent = '200 OK (Local)';
          document.getElementById('timeDisplay').textContent = `${elapsed}ms`;
        } else {
          const targetUrl = source === 'rawSfl'
            ? `https://api.sunflower-land.com/community/farms/${encodeURIComponent(farmId)}`
            : `https://sfl.world/api/v1/prices`;

          out.textContent = `Fetching via CORS proxy:\n${targetUrl}...`;

          // Route through reliable CORS proxy for static GitHub Pages
          const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;
          const headers = { 'Accept': 'application/json' };
          if (apiKey) headers['x-api-key'] = apiKey;

          const res = await fetch(proxyUrl, { headers });
          const elapsed = (performance.now() - t0).toFixed(0);

          document.getElementById('statusDisplay').textContent = `${res.status} ${res.statusText}`;
          document.getElementById('timeDisplay').textContent = `${elapsed}ms`;

          if (!res.ok) {
            if (res.status === 401) {
              throw new Error('401 Unauthorized: Sunflower Land requires an API Key for this farm. Enter your in-game API Key in the API Key box.');
            }
            throw new Error(`HTTP ${res.status}: ${res.statusText}`);
          }

          rawData = await res.json();
        }

        const str = JSON.stringify(rawData, null, 2);
        document.getElementById('sizeDisplay').textContent = `${(new Blob([str]).size / 1024).toFixed(1)} KB`;
        out.textContent = str;
      } catch (err) {
        document.getElementById('statusDisplay').textContent = 'Error';
        out.textContent = `❌ Fetch Failed: ${err.message}`;
      }
    }

    function copyOutput() {
      const out = document.getElementById('output');
      navigator.clipboard.writeText(out.textContent).then(() => {
        alert('Copied JSON to clipboard!');
      });
    }
  </script>
</body>
</html>
