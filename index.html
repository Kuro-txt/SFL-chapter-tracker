<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SFL Chapter Tracker - Ticket Calculator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 sm:p-8 flex flex-col items-center">

  <div class="max-w-7xl w-full space-y-6">
    <!-- Header -->
    <header class="text-center space-y-2">
      <h1 class="text-3xl font-bold text-amber-400 flex items-center justify-center gap-2">
        <span>🌻</span> SFL Chapter Tracker
      </h1>
      <p class="text-slate-400 text-sm">Universal Ticket Calculator Across All Tasks</p>
    </header>

    <!-- Controls & Global Ticket Boost Selectors -->
    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-4 shadow-lg">
      <div class="flex flex-col lg:flex-row gap-4 items-center justify-between">
        <!-- Farm Input & VIP Toggle -->
        <div class="flex flex-wrap items-center gap-3 w-full lg:w-auto">
          <label for="farmId" class="text-xs font-semibold text-slate-300">Farm ID:</label>
          <input 
            type="text" 
            id="farmId" 
            value="8472883706403914" 
            class="bg-slate-900 border border-slate-600 rounded-lg px-3 py-1.5 text-sm w-full sm:w-48 text-amber-300 focus:outline-none focus:border-amber-400 font-mono"
          />
          <label class="flex items-center gap-1.5 text-xs font-semibold text-amber-300 bg-amber-500/10 border border-amber-500/30 px-3 py-1.5 rounded-lg cursor-pointer">
            <input type="checkbox" id="vipToggle" onchange="saveAndRecalculate()" class="accent-amber-500 w-4 h-4 cursor-pointer">
            👑 VIP Active (+2 Deliveries Only)
          </label>
        </div>

        <!-- Interactive Ticket Boost Items (+1 x 3) -->
        <div class="flex items-center gap-3 bg-slate-900/80 px-4 py-2 rounded-lg border border-slate-700 w-full lg:w-auto justify-between lg:justify-start">
          <span class="text-xs font-semibold text-amber-400 whitespace-nowrap">+1 Ticket Items Equipped:</span>
          <div class="flex items-center gap-3 text-xs font-mono">
            <label class="flex items-center gap-1 cursor-pointer">
              <input type="checkbox" id="boost1" onchange="saveAndRecalculate()" class="accent-amber-500 w-4 h-4 cursor-pointer"> Item 1
            </label>
            <label class="flex items-center gap-1 cursor-pointer">
              <input type="checkbox" id="boost2" onchange="saveAndRecalculate()" class="accent-amber-500 w-4 h-4 cursor-pointer"> Item 2
            </label>
            <label class="flex items-center gap-1 cursor-pointer">
              <input type="checkbox" id="boost3" onchange="saveAndRecalculate()" class="accent-amber-500 w-4 h-4 cursor-pointer"> Item 3
            </label>
          </div>
        </div>

        <button 
          onclick="loadTrackerData()" 
          class="w-full lg:w-auto bg-amber-500 hover:bg-amber-600 active:bg-amber-700 text-slate-950 font-bold px-6 py-2 rounded-lg text-sm transition shadow cursor-pointer"
        >
          Fetch Data
        </button>
      </div>
    </div>

    <!-- 3-Column Grid -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

      <!-- Active Deliveries Card -->
      <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-md flex flex-col">
        <h2 class="text-base font-bold text-violet-400 mb-3 border-b border-slate-700 pb-2 flex justify-between items-center">
          <span>📦 Ticket Deliveries</span>
          <span id="deliveriesCount" class="text-xs font-mono bg-slate-700 px-2 py-0.5 rounded text-slate-300">0</span>
        </h2>
        <div id="deliveriesList" class="space-y-3 overflow-y-auto max-h-[600px] pr-1">
          <p class="text-xs text-slate-500">Click fetch to load deliveries...</p>
        </div>
      </div>

      <!-- Bounties Card -->
      <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-md flex flex-col">
        <h2 class="text-base font-bold text-amber-400 mb-3 border-b border-slate-700 pb-2 flex justify-between items-center">
          <span>📜 Ticket Bounties</span>
          <span id="bountiesCount" class="text-xs font-mono bg-slate-700 px-2 py-0.5 rounded text-slate-300">0</span>
        </h2>
        <div id="bountiesList" class="space-y-2 overflow-y-auto max-h-[600px] pr-1">
          <p class="text-xs text-slate-500">Click fetch to load bounties...</p>
        </div>
      </div>

      <!-- Chores Card -->
      <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-md flex flex-col">
        <h2 class="text-base font-bold text-emerald-400 mb-3 border-b border-slate-700 pb-2 flex justify-between items-center">
          <span>🧹 Chores</span>
          <span id="choresCount" class="text-xs font-mono bg-slate-700 px-2 py-0.5 rounded text-slate-300">0</span>
        </h2>
        <div id="choresList" class="space-y-2 overflow-y-auto max-h-[600px] pr-1">
          <p class="text-xs text-slate-500">Click fetch to load chores...</p>
        </div>
      </div>

    </div>
  </div>

  <script>
    let globalData = null;

    // Load saved localStorage configuration when page loads
    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('boost1').checked = localStorage.getItem('sfl_boost1') === 'true';
      document.getElementById('boost2').checked = localStorage.getItem('sfl_boost2') === 'true';
      document.getElementById('boost3').checked = localStorage.getItem('sfl_boost3') === 'true';

      const savedVip = localStorage.getItem('sfl_vip');
      if (savedVip !== null) {
        document.getElementById('vipToggle').checked = savedVip === 'true';
      }

      const savedFarmId = localStorage.getItem('sfl_farmId');
      if (savedFarmId) {
        document.getElementById('farmId').value = savedFarmId;
      }
    });

    // Save configuration to localStorage whenever a checkbox changes
    function saveAndRecalculate() {
      localStorage.setItem('sfl_boost1', document.getElementById('boost1').checked);
      localStorage.setItem('sfl_boost2', document.getElementById('boost2').checked);
      localStorage.setItem('sfl_boost3', document.getElementById('boost3').checked);
      localStorage.setItem('sfl_vip', document.getElementById('vipToggle').checked);
      localStorage.setItem('sfl_farmId', document.getElementById('farmId').value.trim());

      recalculateAll();
    }

    async function loadTrackerData() {
      const farmId = document.getElementById('farmId').value.trim() || '8472883706403914';
      localStorage.setItem('sfl_farmId', farmId);

      try {
        const response = await fetch(`/api/chapter?farmId=${encodeURIComponent(farmId)}`);
        const data = await response.json();

        if (data.error) throw new Error(data.error);

        globalData = data;

        // Auto-detect VIP from API if user hasn't explicitly toggled VIP
        if (localStorage.getItem('sfl_vip') === null) {
          document.getElementById('vipToggle').checked = data.isVipActive;
          localStorage.setItem('sfl_vip', data.isVipActive);
        }

        recalculateAll();

      } catch (err) {
        alert('Error fetching data: ' + err.message);
      }
    }

    function recalculateAll() {
      if (!globalData) return;

      const vipBonus = document.getElementById('vipToggle').checked ? 2 : 0;
      const boostCount = 
        (document.getElementById('boost1').checked ? 1 : 0) +
        (document.getElementById('boost2').checked ? 1 : 0) +
        (document.getElementById('boost3').checked ? 1 : 0);

      // Render Deliveries (Includes VIP + Boosts)
      const deliveriesContainer = document.getElementById('deliveriesList');
      document.getElementById('deliveriesCount').textContent = globalData.deliveries.length;
      deliveriesContainer.innerHTML = globalData.deliveries.map(d => {
        const deliveryAddon = vipBonus + boostCount;
        const finalTickets = d.baseTickets + deliveryAddon;
        return `
          <div class="bg-slate-900/90 p-3 rounded-lg border border-amber-500/40 bg-amber-950/10 text-xs space-y-2">
            <div class="flex justify-between items-center">
              <span class="font-bold text-amber-300 capitalize flex items-center gap-1">
                ${d.from}
                ${d.isChapterNpc ? `<span class="text-[9px] bg-amber-500 text-slate-950 px-1.5 py-0.2 rounded font-bold">Chapter NPC</span>` : ''}
              </span>
              <span class="text-[10px] text-slate-500 font-mono">${d.id}</span>
            </div>

            <div class="text-slate-200 font-medium bg-slate-950/50 p-2 rounded border border-slate-800">
              ${Object.entries(d.items).map(([item, qty]) => `<div>• ${qty}x <span class="text-slate-100 font-bold">${item}</span></div>`).join('')}
            </div>

            <div class="bg-slate-950/80 p-2.5 rounded border border-amber-500/20 space-y-1.5 font-mono text-[11px]">
              <div class="flex justify-between items-center text-amber-300 font-bold border-b border-slate-800 pb-1">
                <span>Calculated Yield:</span>
                <span class="text-sm text-emerald-400 font-bold">${finalTickets} Tickets</span>
              </div>
              <div class="text-[10px] text-slate-400 flex justify-between">
                <span>Base (${d.baseTickets}) + VIP (${vipBonus}) + Boosts (${boostCount}):</span>
                <span>${d.baseTickets} + ${vipBonus} + ${boostCount} = ${finalTickets}</span>
              </div>
            </div>
          </div>
        `;
      }).join('');

      // Render Bounties (Includes Boosts ONLY)
      const bountiesContainer = document.getElementById('bountiesList');
      document.getElementById('bountiesCount').textContent = globalData.bounties.length;
      bountiesContainer.innerHTML = globalData.bounties.map(b => {
        const finalTickets = b.baseTickets + boostCount;
        return `
          <div class="bg-slate-900/80 p-2.5 rounded-lg border border-slate-700 text-xs space-y-2">
            <div class="flex justify-between items-center">
              <span class="font-bold text-slate-200 capitalize">${b.name} ${b.level ? `<span class="text-[10px] text-amber-400 font-mono">(Lvl ${b.level})</span>` : ''}</span>
              <span class="text-[10px] text-slate-500 font-mono">ID: ${b.id}</span>
            </div>
            <div class="bg-slate-950/80 p-2 rounded border border-slate-800 flex justify-between items-center font-mono text-[11px]">
              <span class="text-slate-400 text-[10px]">Base (${b.baseTickets}) + Boosts (${boostCount}):</span>
              <span class="text-emerald-400 font-bold">${finalTickets} Tickets</span>
            </div>
          </div>
        `;
      }).join('');

      // Render Chores (Includes Boosts ONLY)
      const choresContainer = document.getElementById('choresList');
      document.getElementById('choresCount').textContent = globalData.chores.length;
      choresContainer.innerHTML = globalData.chores.map(c => {
        const finalTickets = c.baseTickets > 0 ? (c.baseTickets + boostCount) : 0;
        return `
          <div class="bg-slate-900/80 p-2.5 rounded-lg border ${c.completed ? 'border-emerald-500/40 bg-emerald-950/20' : 'border-slate-700'} text-xs space-y-1.5">
            <div class="flex justify-between items-center">
              <span class="font-bold capitalize text-slate-200">${c.npc}</span>
              <span class="text-[10px] px-2 py-0.5 rounded ${c.completed ? 'bg-emerald-900 text-emerald-300' : 'bg-slate-800 text-amber-300'} font-mono">
                ${c.completed ? 'Done' : 'Active'}
              </span>
            </div>
            <div class="text-slate-300">${c.task}</div>
            ${c.baseTickets > 0 ? `
              <div class="bg-slate-950/80 p-2 rounded border border-slate-800 flex justify-between items-center font-mono text-[11px]">
                <span class="text-slate-400 text-[10px]">Base (${c.baseTickets}) + Boosts (${boostCount}):</span>
                <span class="text-emerald-400 font-bold">${finalTickets} Tickets</span>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>
