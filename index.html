<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SFL Chapter Tracker & Cloud Vault Inspector</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f111a;
      color: #e6edf3;
      font-family: 'Courier New', Courier, monospace, sans-serif;
      padding: 14px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      gap: 10px;
    }
    .panel {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    label {
      font-size: 11px;
      font-weight: bold;
      color: #8b949e;
      text-transform: uppercase;
    }
    select, input, button {
      background: #21262d;
      border: 1px solid #30363d;
      color: #e6edf3;
      padding: 6px 10px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 12px;
      outline: none;
    }
    input:focus, select:focus {
      border-color: #58a6ff;
    }
    button {
      background: #238636;
      border-color: #2ea043;
      font-weight: 900;
      cursor: pointer;
      text-transform: uppercase;
      padding: 6px 14px;
    }
    button:hover { background: #2ea043; }
    .status-bar {
      font-size: 11px;
      color: #8b949e;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }
    .status-bar strong { color: #3fb950; }
    pre {
      flex: 1;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 14px;
      overflow: auto;
      font-size: 12px;
      line-height: 1.45;
      color: #c9d1d9;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>

  <div class="panel">
    <div class="row">
      <label for="endpointSelect">🎯 Target:</label>
      <select id="endpointSelect" onchange="handleTargetChange()">
        <option value="vault">🔐 Cloud Vault Database (/api/chapter?action=getVault)</option>
        <option value="parsed">🌾 Backend Parsed Output (/api/chapter)</option>
        <option value="rawSfl">⚡ Raw SFL Farm API (Direct/Proxied)</option>
        <option value="rawPrices">💰 SFL.world Prices API</option>
      </select>

      <label for="sectionSelect">📦 Filter:</label>
      <select id="sectionSelect" onchange="filterSection()">
        <option value="ALL">ALL DATA</option>
        <option value="archiveDeliveries">archiveDeliveries (Vault)</option>
        <option value="deliveries">deliveries (Active)</option>
        <option value="npcSnapshots">npcSnapshots (Counters)</option>
        <option value="weeks">weeks (History)</option>
        <option value="bounties">bounties</option>
        <option value="chores">chores</option>
        <option value="milestones">milestones</option>
        <option value="inventory">inventory</option>
      </select>

      <button onclick="fetchData()">⚡ Query Target</button>
    </div>

    <div class="row">
      <label for="backendUrlInput">Backend URL:</label>
      <input type="text" id="backendUrlInput" placeholder="e.g. https://your-app.vercel.app" style="flex: 1; min-width: 200px;" />

      <label for="farmIdInput">Farm ID:</label>
      <input type="text" id="farmIdInput" value="8472883706403914" style="width: 140px;" />

      <label for="usernameInput">User:</label>
      <input type="text" id="usernameInput" placeholder="Username" style="width: 110px;" />

      <label for="apiKeyInput">API Key:</label>
      <input type="password" id="apiKeyInput" placeholder="Optional Key" style="width: 110px;" />
    </div>
  </div>

  <div class="status-bar">
    <span>Status: <strong id="statusDisplay">—</strong></span>
    <span>Source: <strong id="sourceDisplay">—</strong></span>
    <span>Time: <strong id="timeDisplay">—</strong></span>
    <span>Payload Size: <strong id="sizeDisplay">—</strong></span>
  </div>

  <pre id="output">// Select a target and click "Query Target" to inspect payload...</pre>

  <script>
    let rawData = null;

    document.addEventListener('DOMContentLoaded', () => {
      const savedFarm = localStorage.getItem('sfl_farmId');
      if (savedFarm) document.getElementById('farmIdInput').value = savedFarm;

      const savedUser = localStorage.getItem('sfl_auth_user');
      if (savedUser) document.getElementById('usernameInput').value = savedUser;

      const savedKey = localStorage.getItem('sfl_apiKey');
      if (savedKey) document.getElementById('apiKeyInput').value = savedKey;

      const savedBackend = localStorage.getItem('sfl_backend_url') || (window.location.origin.includes('github.io') ? '' : window.location.origin);
      document.getElementById('backendUrlInput').value = savedBackend;
    });

    function handleTargetChange() {
      const ep = document.getElementById('endpointSelect').value;
      const sec = document.getElementById('sectionSelect');
      if (ep === 'rawPrices') {
        sec.value = 'ALL';
      }
    }

    async function fetchData() {
      const ep = document.getElementById('endpointSelect').value;
      const farmId = document.getElementById('farmIdInput').value.trim() || '8472883706403914';
      const username = document.getElementById('usernameInput').value.trim();
      const apiKey = document.getElementById('apiKeyInput').value.trim();
      let backendUrl = document.getElementById('backendUrlInput').value.trim().replace(/\/+$/, '');
      const out = document.getElementById('output');

      localStorage.setItem('sfl_farmId', farmId);
      if (username) localStorage.setItem('sfl_auth_user', username);
      if (apiKey) localStorage.setItem('sfl_apiKey', apiKey);
      if (backendUrl) localStorage.setItem('sfl_backend_url', backendUrl);

      const t0 = performance.now();
      document.getElementById('statusDisplay').textContent = 'Fetching...';

      try {
        if (ep === 'vault' || ep === 'parsed') {
          if (!backendUrl && window.location.origin.includes('github.io')) {
            throw new Error('On GitHub Pages, enter your deployed Vercel URL (e.g. https://your-project.vercel.app) in "Backend URL" to read your PostgreSQL Cloud Vault.');
          }

          const base = backendUrl || window.location.origin;
          const actionParam = ep === 'vault' ? '&action=getVault' : '';
          const userParam = username ? `&username=${encodeURIComponent(username)}` : '';
          const keyParam = apiKey ? `&apiKey=${encodeURIComponent(apiKey)}` : '';
          const url = `${base}/api/chapter?farmId=${encodeURIComponent(farmId)}${actionParam}${userParam}${keyParam}`;

          out.textContent = `Connecting to Backend: ${url}...`;
          const res = await fetch(url);
          const elapsed = (performance.now() - t0).toFixed(0);

          document.getElementById('statusDisplay').textContent = `${res.status} ${res.statusText}`;
          document.getElementById('sourceDisplay').textContent = 'PostgreSQL / Vercel API';
          document.getElementById('timeDisplay').textContent = `${elapsed}ms`;

          if (!res.ok) {
            const errJson = await res.json().catch(() => ({}));
            throw new Error(errJson.error || `HTTP ${res.status}`);
          }

          rawData = await res.json();
        } else if (ep === 'rawPrices') {
          const url = 'https://sfl.world/api/v1/prices';
          out.textContent = `Connecting to ${url}...`;
          const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(url)}`;
          const res = await fetch(proxyUrl);
          const elapsed = (performance.now() - t0).toFixed(0);

          document.getElementById('statusDisplay').textContent = `${res.status} OK`;
          document.getElementById('sourceDisplay').textContent = 'sfl.world';
          document.getElementById('timeDisplay').textContent = `${elapsed}ms`;

          rawData = await res.json();
        } else if (ep === 'rawSfl') {
          const directUrl = `https://api.sunflower-land.com/community/farms/${encodeURIComponent(farmId)}`;
          out.textContent = `Connecting to ${directUrl}...`;

          const headers = { 'Accept': 'application/json' };
          if (apiKey) headers['x-api-key'] = apiKey;

          const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(directUrl)}`;
          const res = await fetch(proxyUrl, { headers });
          const elapsed = (performance.now() - t0).toFixed(0);

          document.getElementById('statusDisplay').textContent = `${res.status} ${res.statusText}`;
          document.getElementById('sourceDisplay').textContent = 'api.sunflower-land.com';
          document.getElementById('timeDisplay').textContent = `${elapsed}ms`;

          if (!res.ok) {
            if (res.status === 401) {
              throw new Error('401 Unauthorized: SFL API rejected the request. Please enter your in-game API Key in the API Key box.');
            }
            throw new Error(`HTTP ${res.status}: ${res.statusText}`);
          }

          rawData = await res.json();
        }

        const str = JSON.stringify(rawData, null, 2);
        document.getElementById('sizeDisplay').textContent = `${(new Blob([str]).size / 1024).toFixed(1)} KB`;
        filterSection();
      } catch (err) {
        document.getElementById('statusDisplay').textContent = 'Error';
        out.textContent = `❌ ${err.message}`;
      }
    }

    function filterSection() {
      if (!rawData) return;
      const sec = document.getElementById('sectionSelect').value;
      const out = document.getElementById('output');

      if (sec === 'ALL') {
        out.textContent = JSON.stringify(rawData, null, 2);
        return;
      }

      const root = rawData.vaultData || rawData.farm || rawData;
      let target = root[sec];

      if (target === undefined && sec === 'chores') {
        target = root.choreBoard || root.chores;
      }

      out.textContent = target !== undefined 
        ? JSON.stringify(target, null, 2) 
        : JSON.stringify({ message: `Field "${sec}" not found in current payload state.` }, null, 2);
    }
  </script>
</body>
</html>
